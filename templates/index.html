<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop Disease Detector</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    text-align: center;
    width: 420px;
  }
  h1 {
    color: #2e7d32;
    font-size: 24px;
    margin-bottom: 10px;
  }
  p.subtitle {
    color: #666;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .sourceTabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .sourceTabs button {
    flex: 1;
    padding: 10px;
    border: 2px solid #4caf50;
    background: white;
    color: #2e7d32;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .sourceTabs button.active {
    background: #2e7d32;
    color: white;
  }
  #uploadPanel, #cameraPanel {
    display: none;
  }
  #uploadPanel.active, #cameraPanel.active {
    display: block;
  }
  input[type="file"] {
    margin-bottom: 10px;
  }
  #cameraVideo {
    width: 100%;
    max-height: 260px;
    border-radius: 10px;
    background: #000;
    display: none;
  }
  #startCameraBtn, #captureBtn {
    background: #4caf50;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 8px;
  }
  #captureBtn { display: none; }
  #imageWrapper {
    position: relative;
    display: none;
    margin: 15px 0;
    border-radius: 10px;
    overflow: hidden;
  }
  #imagePreview {
    max-width: 100%;
    max-height: 220px;
    display: block;
    border-radius: 10px;
    margin: 0 auto;
  }
  #scanLine {
    position: absolute;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #4caf50, #00e676, #4caf50, transparent);
    box-shadow: 0 0 12px 4px rgba(76,175,80,0.7);
    display: none;
    animation: scan 1.6s ease-in-out infinite;
  }
  @keyframes scan {
    0%   { top: 0%; }
    50%  { top: 100%; }
    100% { top: 0%; }
  }
  #gridOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(76,175,80,0.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,175,80,0.25) 1px, transparent 1px);
    background-size: 20px 20px;
    display: none;
    animation: pulseGrid 1.6s ease-in-out infinite;
  }
  @keyframes pulseGrid {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }
  button.mainBtn {
    background: #2e7d32;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    width: 100%;
    margin-top: 10px;
    transition: background 0.2s;
  }
  button.mainBtn:hover:not(:disabled) {
    background: #256428;
  }
  button.mainBtn:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  #loading {
    display: none;
    margin-top: 18px;
    color: #2e7d32;
    font-size: 14px;
    font-weight: 600;
  }
  #loadingText::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 3px solid #c8e6c9;
    border-top-color: #2e7d32;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    display: none;
    text-align: left;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.4s ease forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  #result.healthy { background: #e8f5e9; border: 1px solid #4caf50; }
  #result.diseased { background: #ffebee; border: 1px solid #f44336; }
  #result h3 { margin: 0 0 8px 0; }
  #result p { margin: 4px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🌱 Crop Disease Detector</h1>
    <p class="subtitle">Upload a photo or use your camera for instant diagnosis</p>

    <div class="sourceTabs">
      <button id="tabUpload" class="active" onclick="switchTab('upload')">📁 Upload</button>
      <button id="tabCamera" onclick="switchTab('camera')">📷 Camera</button>
    </div>

    <div id="uploadPanel" class="active">
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="cameraPanel">
      <video id="cameraVideo" autoplay playsinline></video>
      <br>
      <button id="startCameraBtn" onclick="startCamera()">Start Camera</button>
      <button id="captureBtn" onclick="capturePhoto()">📸 Capture</button>
      <canvas id="cameraCanvas" style="display:none;"></canvas>
    </div>

    <div id="imageWrapper">
      <img id="imagePreview">
      <div id="gridOverlay"></div>
      <div id="scanLine"></div>
    </div>

    <button class="mainBtn" id="predictBtn" onclick="predict()" disabled>Analyze Leaf</button>

    <div id="loading">
      <span class="spinner"></span><span id="loadingText">AI analyzing leaf</span>
    </div>
    <div id="result"></div>
  </div>

<script>
  const fileInput = document.getElementById('fileInput');
  const imagePreview = document.getElementById('imagePreview');
  const imageWrapper = document.getElementById('imageWrapper');
  const scanLine = document.getElementById('scanLine');
  const gridOverlay = document.getElementById('gridOverlay');
  const predictBtn = document.getElementById('predictBtn');
  const resultDiv = document.getElementById('result');
  const loadingDiv = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  const cameraVideo = document.getElementById('cameraVideo');
  const cameraCanvas = document.getElementById('cameraCanvas');
  const startCameraBtn = document.getElementById('startCameraBtn');
  const captureBtn = document.getElementById('captureBtn');

  let selectedFile = null;
  let cameraStream = null;

  const statusMessages = [
    "AI analyzing leaf",
    "Detecting patterns",
    "Checking disease markers",
    "Finalizing diagnosis"
  ];
  let statusInterval = null;

  function switchTab(tab) {
    document.getElementById('tabUpload').classList.toggle('active', tab === 'upload');
    document.getElementById('tabCamera').classList.toggle('active', tab === 'camera');
    document.getElementById('uploadPanel').classList.toggle('active', tab === 'upload');
    document.getElementById('cameraPanel').classList.toggle('active', tab === 'camera');

    if (tab === 'upload' && cameraStream) {
      stopCamera();
    }
  }

  function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        cameraStream = stream;
        cameraVideo.srcObject = stream;
        cameraVideo.style.display = 'block';
        startCameraBtn.style.display = 'none';
        captureBtn.style.display = 'inline-block';
      })
      .catch(err => {
        alert('Could not access camera. Please allow camera permission or use Upload instead.');
      });
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    cameraVideo.style.display = 'none';
    startCameraBtn.style.display = 'inline-block';
    captureBtn.style.display = 'none';
  }

  function capturePhoto() {
    const context = cameraCanvas.getContext('2d');
    cameraCanvas.width = cameraVideo.videoWidth;
    cameraCanvas.height = cameraVideo.videoHeight;
    context.drawImage(cameraVideo, 0, 0);

    cameraCanvas.toBlob(function(blob) {
      selectedFile = new File([blob], "capture.jpg", { type: "image/jpeg" });
      imagePreview.src = URL.createObjectURL(blob);
      imageWrapper.style.display = 'block';
      predictBtn.disabled = false;
      resultDiv.style.display = 'none';

      stopCamera();
    }, 'image/jpeg', 0.95);
  }

  fileInput.addEventListener('change', function(e) {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        imagePreview.src = evt.target.result;
        imageWrapper.style.display = 'block';
      };
      reader.readAsDataURL(selectedFile);
      predictBtn.disabled = false;
      resultDiv.style.display = 'none';
    }
  });

  function predict() {
    if (!selectedFile) return;
    const formData = new FormData();
    formData.append('image', selectedFile);

    resultDiv.style.display = 'none';
    predictBtn.disabled = true;
    loadingDiv.style.display = 'block';
    scanLine.style.display = 'block';
    gridOverlay.style.display = 'block';

    let msgIndex = 0;
    loadingText.textContent = statusMessages[0];
    statusInterval = setInterval(() => {
      msgIndex = (msgIndex + 1) % statusMessages.length;
      loadingText.textContent = statusMessages[msgIndex];
    }, 700);

    const startTime = Date.now();
    const minDisplayTime = 1800;

    fetch('/predict', {
      method: 'POST',
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      const elapsed = Date.now() - startTime;
      const delay = Math.max(0, minDisplayTime - elapsed);
      setTimeout(() => showResult(data), delay);
    })
    .catch(err => {
      const elapsed = Date.now() - startTime;
      const delay = Math.max(0, minDisplayTime - elapsed);
      setTimeout(() => showResult({ error: 'Something went wrong. Try again.' }), delay);
    });
  }

  function showResult(data) {
    clearInterval(statusInterval);
    loadingDiv.style.display = 'none';
    scanLine.style.display = 'none';
    gridOverlay.style.display = 'none';
    predictBtn.disabled = false;

    if (data.error) {
      resultDiv.className = 'diseased';
      resultDiv.innerHTML = `<p>${data.error}</p>`;
    } else {
      const isHealthy = data.disease.includes('healthy');
      resultDiv.className = isHealthy ? 'healthy' : 'diseased';
      const readableName = data.disease.replace(/___/g, ' - ').replace(/_/g, ' ');
      resultDiv.innerHTML = `
        <h3>${isHealthy ? '✅' : '⚠️'} ${readableName}</h3>
        <p><strong>Confidence:</strong> ${data.confidence}%</p>
        <p><strong>Recommendation:</strong> ${data.treatment}</p>
      `;
    }
    resultDiv.style.display = 'block';
  }
</script>
</body>
</html>
